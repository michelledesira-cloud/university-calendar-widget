<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upcoming Classes</title>
  <style>
    :root { font-family: Georgia, "Times New Roman", serif; color: #302e2b; background: #fbfaf8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; max-width: 660px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -.4px; margin: 0; }
    .sub { font-size: 12px; color: #817e78; margin-top: 5px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    button, select { border: 1px solid #e4e0da; border-radius: 9px; background: white; padding: 9px 12px; font: inherit; font-size: 12px; color: inherit; }
    button { cursor: pointer; }
    button:hover { background: #f2f0eb; }
    select { max-width: 100%; flex: 1; min-width: 150px; }
    #events { border: 1px solid #eeeae4; border-radius: 14px; overflow: hidden; background: white; }
    .event { display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-bottom: 1px solid #f0eeea; text-decoration: none; color: inherit; }
    .event:last-child { border-bottom: 0; }
    .event:hover { background: #fcfbfa; }
    .day { min-width: 47px; text-align: center; padding: 7px 4px; border-radius: 9px; background: #f3f0eb; }
    .weekday { font-size: 10px; letter-spacing: .4px; color: #77716b; }
    .number { font-size: 20px; font-weight: 700; }
    .info { flex: 1; min-width: 0; }
    .title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .meta { font-size: 12px; color: #817e78; margin-top: 4px; }
    .empty { padding: 22px 16px; color: #817e78; font-size: 13px; }
    .pill { font-size: 11px; border-radius: 20px; background: #e8edf7; color: #506585; padding: 5px 9px; white-space: nowrap; }
    .module-filter { flex-basis: 100%; }
    #status { font-size: 12px; color: #77716b; margin: 8px 0; min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📚 Upcoming Classes</h1>
      <div class="sub">Your university timetable, in one simple list</div>
    </div>
    <button id="connect">Connect Google</button>
  </header>
  <div class="controls">
    <select id="calendar" aria-label="Choose university calendar" disabled>
      <option>Connect to select calendar</option>
    </select>
    <button id="refresh" disabled>↻ Refresh</button>
    <select id="module" class="module-filter" aria-label="Filter by module" disabled>
      <option value="all">All modules</option>
    </select>
  </div>
  <div id="status" role="status"></div>
  <div id="events"><div class="empty">Connect your Google account to display upcoming lectures and tutorials.</div></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const CLIENT_ID = '463372546640-ideuetn7mvbjo26sol9vkhlcgmmhqdpr.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';
    let tokenClient, token = null;
    let cachedEvents = [];

    const $ = id => document.getElementById(id);
    const status = message => { $('status').textContent = message; };
    const htmlEscape = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function client() {
      if (!window.google?.accounts?.oauth2) {
        status('Google sign-in is still loading. Try again.');
        return null;
      }
      return tokenClient ??= google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async response => {
          if (response.error) {
            status('Sign-in failed: ' + response.error);
            return;
          }
          token = response.access_token;
          $('connect').textContent = 'Reconnect';
          await loadCalendars();
        }
      });
    }

    $('connect').onclick = () => {
      const c = client();
      if (c) c.requestAccessToken({ prompt: token ? '' : 'consent' });
    };
    $('refresh').onclick = () => loadEvents();
    $('module').onchange = () => {
      localStorage.setItem('universityModuleFilter', $('module').value);
      renderEvents();
    };
    $('calendar').onchange = () => {
      localStorage.setItem('universityCalendarId', $('calendar').value);
      loadEvents();
    };

    async function api(url) {
      const response = await fetch(url, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!response.ok) {
        throw new Error('Google Calendar returned ' + response.status +
          (response.status === 401 ? ' — reconnect your account.' : ''));
      }
      return response.json();
    }

    async function loadCalendars() {
      try {
        status('Loading your calendars…');
        const data = await api('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250');
        const select = $('calendar');
        select.innerHTML = '';
        (data.items || []).filter(x => !x.deleted).forEach(c => {
          const option = document.createElement('option');
          option.value = c.id;
          option.textContent = c.summary;
          select.appendChild(option);
        });
        if (!select.options.length) {
          status('No calendars found on this Google account.');
          return;
        }
        const remembered = localStorage.getItem('universityCalendarId');
        if (remembered && [...select.options].some(x => x.value === remembered)) {
          select.value = remembered;
        } else {
          const likely = [...select.options].find(o => /uni|university|lecture|classes|school|timetable|course/i.test(o.textContent));
          if (likely) select.value = likely.value;
        }
        select.disabled = false;
        $('refresh').disabled = false;
        await loadEvents();
      } catch (error) {
        status(error.message);
      }
    }

    // A module code at the beginning of a timetable title, e.g. CIS5113/AE/S1/LEC/01.
    function moduleCode(event) {
      const title = (event.summary || '').trim();
      const match = title.match(/^([A-Z]{2,6}\d{3,6})(?=\/|\b)/i);
      return match ? match[1].toUpperCase() : 'Other';
    }

    function updateModuleOptions() {
      const selector = $('module');
      const previous = selector.value !== 'all' ? selector.value : localStorage.getItem('universityModuleFilter');
      const codes = [...new Set(cachedEvents.map(moduleCode))].sort((a, b) =>
        a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b));
      selector.replaceChildren();
      const all = new Option('All modules', 'all');
      selector.appendChild(all);
      codes.forEach(code => selector.appendChild(new Option(code === 'Other' ? 'Other events' : code, code)));
      selector.value = codes.includes(previous) ? previous : 'all';
      selector.disabled = false;
    }

    function renderEvents() {
      const selection = $('module').value;
      const matching = cachedEvents.filter(e => selection === 'all' || moduleCode(e) === selection);
      const shown = matching.slice(0, 15);
      const target = $('events');
      target.replaceChildren();
      if (!shown.length) {
        target.innerHTML = '<div class="empty">No upcoming events for this module in the next 250 calendar events. Try All modules.</div>';
        status('No matching upcoming events');
        return;
      }
      for (const event of shown) {
        const start = event.start?.dateTime || event.start?.date;
        const end = event.end?.dateTime || event.end?.date;
        if (!start) continue;
        const date = new Date(start);
        const allDay = !!event.start?.date;
        const weekday = new Intl.DateTimeFormat(undefined, { weekday: 'short' }).format(date).toUpperCase();
        const day = new Intl.DateTimeFormat(undefined, { day: 'numeric' }).format(date);
        const dateLabel = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(date);
        const timeLabel = allDay ? 'All day' :
          new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(date) +
          (end ? ' – ' + new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(end)) : '');
        const type = /tutorial|seminar/i.test(event.summary || '') ? 'Tutorial' :
          /lecture/i.test(event.summary || '') ? 'Lecture' : 'Class';
        const line = document.createElement('a');
        line.className = 'event';
        line.href = event.htmlLink || 'https://calendar.google.com';
        line.target = '_blank';
        line.rel = 'noopener noreferrer';
        line.innerHTML = `<div class="day"><div class="weekday">${htmlEscape(weekday)}</div><div class="number">${htmlEscape(day)}</div></div><div class="info"><div class="title">${htmlEscape(event.summary || 'Untitled event')}</div><div class="meta">${htmlEscape(dateLabel + ' · ' + timeLabel + (event.location ? ' · ' + event.location : ''))}</div></div><span class="pill">${type}</span>`;
        target.appendChild(line);
      }
      status('Showing next ' + shown.length + ' ' + (selection === 'all' ? 'events' : 'events for ' + selection) + ' · Refresh to update');
    }

    async function loadEvents() {
      if (!token || !$('calendar').value) return;
      status('Updating events…');
      try {
        const id = encodeURIComponent($('calendar').value);
        const params = new URLSearchParams({
          timeMin: new Date().toISOString(),
          singleEvents: 'true',
          orderBy: 'startTime',
          maxResults: '250'
        });
        const data = await api(`https://www.googleapis.com/calendar/v3/calendars/${id}/events?${params}`);
        cachedEvents = (data.items || []).filter(e => e.status !== 'cancelled' && (e.start?.dateTime || e.start?.date));
        updateModuleOptions();
        renderEvents();
      } catch (error) {
        status(error.message);
      }
    }
  </script>
</body>
</html>
